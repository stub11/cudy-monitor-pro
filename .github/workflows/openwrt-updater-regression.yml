name: OpenWrt updater verification (pull requests)
on:
  pull_request:
    paths:
      - 'packaging/openwrt/files/update-native.sh'
      - 'packaging/openwrt/tests/**'
      - 'packaging/openwrt/migrate-legacy.sh'
      - 'packaging/openwrt/install-openwrt.sh'
      - '.github/workflows/openwrt-25.12-apk.yml'
      - '.github/workflows/openwrt-updater-regression.yml'
permissions:
  contents: read
jobs:
  update-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax checks
        run: |
          sh -n packaging/openwrt/files/update-native.sh
          sh -n packaging/openwrt/migrate-legacy.sh
          sh -n packaging/openwrt/tests/test-running-version.sh
          sh -n packaging/openwrt/tests/test-release-fallback.sh
          sh -n packaging/openwrt/tests/test-upgrade-verification.sh
          sh -n packaging/openwrt/tests/test-upgrade-activation.sh
      - name: Verify running version comparison with isolated synthetic processes
        run: sh packaging/openwrt/tests/test-running-version.sh
      - name: Offline GitHub API 403 and SHA-256 fallback regression
        run: sh packaging/openwrt/tests/test-release-fallback.sh
      - name: Separate disk, health and process checks (offline)
        run: sh packaging/openwrt/tests/test-upgrade-verification.sh
      - name: Safely activate only a matching installed APK (offline)
        run: sh packaging/openwrt/tests/test-upgrade-activation.sh
      - name: Legacy OpenWrt migration safety guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('packaging/openwrt/migrate-legacy.sh').read_text()
          assert 'raw.githubusercontent.com/stub11/cudy-monitor-pro/81360c8077e6c5f9bae739d92120ab46e836e8bc/packaging/openwrt/files/update-native.sh' in s
          assert "curl --proto '=https' --tlsv1.2 -fsSL" in s
          assert '"/bin/sh" "$TMP" --check' not in s
          assert '/bin/sh "$TMP" --check' in s
          assert '/bin/sh "$TMP" --apply' in s
          assert 'trap ' in s and 'rm -f "$TMP"' in s
          assert '1.2.21' in s and '1.2.22' in s and '1.2.23' in s
          assert 'apk add' not in s and 'wget' not in s
          print("Legacy migration uses immutable HTTPS script and verified updater")
          PY
      - name: Verify LAN bind cannot abort after APK replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('packaging/openwrt/files/update-native.sh').read_text()
          bind=s.index('BIND=$(head -n 1 /etc/cudy-monitor-pro/bind')
          old=s.index('download_verified "$CURRENT" "$DIR/previous.apk"')
          new=s.index('download_verified "$LATEST" "$DIR/next.apk"')
          change=s.index('if ! apk add --allow-untrusted "$DIR/next.apk"; then')
          validate=s.index('die "Stored LAN bind invalid; update not started"')
          empty=s.index('die "Stored LAN bind empty; update not started"')
          assert bind < validate < old < new < change
          assert bind < empty < old
          assert s.count('BIND=$(head -n 1 /etc/cudy-monitor-pro/bind') == 1
          assert 'Upgrade completed but stored LAN bind invalid' not in s
          print('PASS: invalid panel bind fails before APK installation')
          PY
      - name: Require exact daemon and binary verification before UPDATE success
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('packaging/openwrt/files/update-native.sh').read_text()
          assert 'running_matches "$expected"' in s
          assert 'verify_updated "$LATEST"' in s
          assert 'running_matches "$CURRENT"' in s
          assert 'AFTER=$("$SELF" --version' in s
          assert 'if [ "$AFTER" != "cudy-monitor-pro $LATEST" ]; then' in s
          assert s.index('verify_updated "$LATEST"') < s.index('echo "UPDATED $LATEST')
          assert s.index('AFTER=$("$SELF" --version') < s.index('echo "UPDATED $LATEST')
          print("OpenWrt update success requires exact live and disk version")
          PY
      - name: Verify standalone installer version and immutable release digest pin
        run: |
          sh -n packaging/openwrt/install-openwrt.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          installer = Path("packaging/openwrt/install-openwrt.sh").read_text()
          workflow = Path(".github/workflows/openwrt-25.12-apk.yml").read_text()
          pkg = Path("packaging/openwrt/Makefile").read_text()
          cargo = Path("cudy-monitor/Cargo.toml").read_text()
          version = re.search(r'(?m)^VERSION=([0-9]+\.[0-9]+\.[0-9]+)$', installer)
          digest = re.search(r'(?m)^EXPECTED_SHA256=([a-f0-9]{64})$', installer)
          assert version and digest, "Installer version or pinned SHA-256 missing"
          package_version = re.search(r'(?m)^PKG_VERSION:=([0-9]+\.[0-9]+\.[0-9]+)$', pkg)
          cargo_version = re.search(r'(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"$', cargo)
          assert package_version and cargo_version and cargo_version.group(1) == package_version.group(1)
          # Published v1.2.25 artifact SHA256 from the official GitHub Release.
          # Published version must be identical across package and installer.
          assert package_version.group(1) == version.group(1) == '1.2.25'
          assert digest.group(1) == 'c5f08c26b3d04e95fe18aeb98e8cf71f5683b0bb934425a48199ff32dffdb668'
          assert f"EXPECTED_SHA256={digest.group(1)}" in workflow
          assert f"VERSION={version.group(1)}" in workflow
          assert 'ACTUAL_SHA256=$(sha256sum "$TARGET"' in installer
          assert '[ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ]' in installer
          print("OpenWrt installer version, checksum pin and guard consistent")
          PY
