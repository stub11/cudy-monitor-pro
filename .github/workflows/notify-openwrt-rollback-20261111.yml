name: One-time OpenWrt rollback diagnostics request
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notify-openwrt-rollback-20261111.yml'
permissions:
  contents: read
jobs:
  notify:
    if: github.event.head_commit.message == 'chore: activate OpenWrt diagnostics notification'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Send diagnostic request to existing topic
        env:
          BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CUDY_TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.CUDY_TELEGRAM_TOPIC_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ.get('BOT_TOKEN','')
          chat=os.environ.get('CHAT_ID','')
          topic=os.environ.get('TOPIC_ID','')
          if not all((token,chat,topic)): raise SystemExit('Telegram destination not configured')
          text=('Никита, спасибо за тест обновления 1.2.21 → 1.2.23! 🦊\n\n'
                'APK установился, но проверка службы не прошла. Откат успешно вернул 1.2.21 — защита сработала. Повторно обновляться пока не нужно.\n\n'
                'Чтобы выяснить причину, можешь выполнить только чтение по SSH:\n'
                '/usr/bin/cudy-monitor-pro --version\n'
                '/etc/init.d/cudy-monitor-pro status\n'
                'pidof cudy-monitor-pro\n'
                'logread | grep -i cudy | tail -n 25\n\n'
                'Пришли вывод, предварительно скрыв IP, токены и приватные сведения. Конфигурацию PPPoE, DNS, DoH/DoT и прошивку не трогай.\n'
                'Завели отдельную задачу GitHub #85; готовим проверку запуска службы без ослабления безопасного отката.')
          payload=json.dumps({'chat_id':chat,'message_thread_id':int(topic),'text':text}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=payload,headers={'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=15) as response: result=json.load(response)
          except Exception: raise SystemExit('Telegram delivery failed (details redacted)')
          if not result.get('ok'): raise SystemExit('Telegram did not confirm message')
          print('Delivery confirmed; message_id='+str(result['result']['message_id']))
          PY
