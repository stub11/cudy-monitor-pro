name: Build native OpenWrt 25.12 APK v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/openwrt/**'
      - 'scripts/easy-install.sh'
      - '.github/workflows/openwrt-25.12-apk.yml'
      - 'cudy-monitor/src/**'
      - 'cudy-monitor/web/**'
      - 'cudy-monitor/Cargo.toml'
      - 'cudy-monitor/scripts/detect-lan.sh'
permissions:
  contents: write
jobs:
  mediatek-filogic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - name: Validate package sources
        shell: bash
        run: |
          set -euo pipefail
          sh -n packaging/openwrt/files/cudy-monitor-pro.init
          sh -n packaging/openwrt/files/update-native.sh
          grep -q 'apk add --allow-untrusted' packaging/openwrt/files/update-native.sh
          grep -q 'sha256sum' packaging/openwrt/files/update-native.sh
          grep -q 'package_digest' packaging/openwrt/files/update-native.sh
          sh -n packaging/openwrt/files/cudy-monitor-lan
          sh -n packaging/openwrt/install-openwrt.sh
          # Offline fallback must not bypass integrity verification.
          grep -q 'EXPECTED_SHA256=a1fe57eb09855334daccbbe6f690465ca7a9bf7a68433467c0be051561ae8a76' packaging/openwrt/install-openwrt.sh
          grep -q 'ACTUAL_SHA256' packaging/openwrt/install-openwrt.sh
          grep -q 'download_file' packaging/openwrt/install-openwrt.sh
          grep -q '\-\-file' packaging/openwrt/install-openwrt.sh
          sh -n scripts/easy-install.sh
          sh -n cudy-monitor/scripts/detect-lan.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packaging/openwrt/Makefile').read_text()
          assert '$(eval $(call BuildPackage,cudy-monitor-pro))' in p
          assert '/usr/bin/cudy-monitor-pro' in p
          assert '/etc/init.d/cudy-monitor-pro' in p
          assert 'update-native.sh' in p
          assert 'IPKG_INSTROOT' in p
          sh=Path('packaging/openwrt/files/cudy-monitor-pro.init').read_text()
          assert 'USE_PROCD=1' in sh and 'CUDY_MONITOR_SERVICE_ACTIONS=$ACTIONS' in sh
          assert 'ACTIONS=0' in sh and 'CUDY_MONITOR_NATIVE_APK=1' in sh
          install=Path('packaging/openwrt/install-openwrt.sh').read_text()
          assert 'apk add --allow-untrusted' in install and 'ACTUAL_SHA256=$(sha256sum' in install and 'EXPECTED_SHA256=' in install and 'cudy-monitor-lan --lan' in install
          # The standalone installer stays pinned to the published 1.2.13 APK until 1.2.14 has a verified digest.
          assert 'PKG_VERSION:=1.2.14' in p
          assert 'VERSION=1.2.13' in install
          easy=Path('scripts/easy-install.sh').read_text()
          assert 'if [ -f /etc/openwrt_release ]; then' in easy
          assert 'elif [ -d /opt/etc/init.d ] && [ -x /opt/bin/opkg ]; then' in easy
          assert '/bin/sh "$FILE" --lan' in easy
          assert 'packaging/openwrt/install-openwrt.sh' in easy
          assert 'apk del cudy-monitor-pro' in easy
          assert '/opt/bin/opkg remove cudy-monitor-pro' in easy
          assert 'ACTION=${1:---install}' in easy
          assert 'forbidden placeholder' not in easy
          PY
      - name: Build static Linux ARM64 binary
        working-directory: cudy-monitor
        run: cross build --release --target aarch64-unknown-linux-musl
      - name: Download and validate official OpenWrt 25.12.6 SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          SDK_FILE=openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          SDK_URL=https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/$SDK_FILE
          curl -fL --retry 3 "$SDK_URL" -o "$RUNNER_TEMP/$SDK_FILE"
          echo "1c04ac47bdfc361d6aab299eb520d570e368013dedcb8d29cf39dc7168ae642e  $RUNNER_TEMP/$SDK_FILE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf "$RUNNER_TEMP/$SDK_FILE" -C "$RUNNER_TEMP/sdk" --strip-components=1
      - name: Package through OpenWrt SDK (not Alpine)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/sdk"
          mkdir -p "$SDK/package/cudy-monitor-pro/files"
          cp packaging/openwrt/Makefile "$SDK/package/cudy-monitor-pro/Makefile"
          cp packaging/openwrt/files/* "$SDK/package/cudy-monitor-pro/files/"
          cp cudy-monitor/scripts/detect-lan.sh "$SDK/package/cudy-monitor-pro/files/detect-lan.sh"
          cp cudy-monitor/target/aarch64-unknown-linux-musl/release/cudy-monitor-pro "$SDK/package/cudy-monitor-pro/files/cudy-monitor-pro"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' cudy-monitor/Cargo.toml)"
          grep -q "PKG_VERSION:=$VERSION" "$SDK/package/cudy-monitor-pro/Makefile"
          cd "$SDK"
          printf '\nCONFIG_PACKAGE_cudy-monitor-pro=y\n' >> .config
          make defconfig
          make package/cudy-monitor-pro/compile V=s -j2
          mkdir -p "$GITHUB_WORKSPACE/openwrt-apk-artifacts"
          find bin -name 'cudy-monitor-pro-*.apk' -type f -exec cp -v {} "$GITHUB_WORKSPACE/openwrt-apk-artifacts/" \;
          test "$(find "$GITHUB_WORKSPACE/openwrt-apk-artifacts" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          file "$GITHUB_WORKSPACE"/openwrt-apk-artifacts/*.apk
          (cd "$GITHUB_WORKSPACE/openwrt-apk-artifacts" && sha256sum ./*.apk | tee SHA256SUMS)
          # Check packaging tools' own metadata, not tar/ar: APK v3 is an ADB container.
          APK_BIN="$(find "$SDK/staging_dir" -type f -path '*/bin/apk' | head -n1 || true)"
          if [ -n "$APK_BIN" ]; then "$APK_BIN" info --help >/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cudy-monitor-openwrt-25.12.6-mediatek-filogic-apk-v3
          path: openwrt-apk-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental native OpenWrt APK release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' cudy-monitor/Cargo.toml)"
          TAG="cudy-monitor-openwrt-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite immutable build"
            exit 0
          fi
          gh release create "$TAG" openwrt-apk-artifacts/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Cudy Monitor Pro $VERSION — OpenWrt 25.12 APK v3" \
            --notes "Experimental OpenWrt 25.12.6 ARM64 package. One-command install: wget -qO /tmp/cudy-monitor-install.sh https://raw.githubusercontent.com/stub11/cudy-monitor-pro/main/packaging/openwrt/install-openwrt.sh && sh /tmp/cudy-monitor-install.sh . Auto-detects trusted LAN and opens dashboard port 8237; ambiguous LAN falls back safely to loopback. Unsigned APK; verify checksum. No WAN exposure. Cudy WBR3000UAX OpenWrt hardware testing pending; no router firmware is modified."
