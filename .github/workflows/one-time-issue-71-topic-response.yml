name: One-time response to OpenWrt tester in existing topic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-issue-71-topic-response.yml'

permissions:
  contents: read

jobs:
  send-reply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Post safe diagnostic reply to existing support topic
        env:
          CUDY_TELEGRAM_BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
          CUDY_TELEGRAM_CHAT_ID: ${{ secrets.CUDY_TELEGRAM_CHAT_ID }}
          CUDY_TELEGRAM_TOPIC_ID: ${{ secrets.CUDY_TELEGRAM_TOPIC_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, sys
          token=os.environ.get('CUDY_TELEGRAM_BOT_TOKEN','').strip()
          chat=os.environ.get('CUDY_TELEGRAM_CHAT_ID','').strip()
          topic=os.environ.get('CUDY_TELEGRAM_TOPIC_ID','').strip() or '87621'
          if not token or not chat or not topic.isdigit():
              print('REPLY_NOT_SENT: missing chat, topic or bot configuration')
              sys.exit(1)
          msg=('🛠 Ответ тестеру по обновлению Cudy Monitor Pro на OpenWrt ARM64 (Netis).\n\n'
               'Проверил GitHub: релиз OpenWrt 1.2.20 и APK существуют. Ошибка HTTP 404 при повторной проверке с роутера ещё не означает, что релиз отсутствует.\n\n'
               'Пожалуйста, пока не запускайте установку повторно. Для диагностики нужны только:\n'
               '1) Номер версии из /usr/bin/cudy-monitor-pro --version\n'
               '2) Версия монитора в веб-панели\n'
               '3) HTTP-коды двух безопасных запросов на роутере:\n'
               'curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 "https://api.github.com/repos/stub11/cudy-monitor-pro/releases?per_page=50"\n'
               'curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 "https://api.github.com/repos/stub11/cudy-monitor-pro/releases/tags/cudy-monitor-openwrt-v1.2.20"\n\n'
               'Ответьте, пожалуйста, сюда только двумя номерами версии и двумя HTTP-кодами. Не присылайте пароли, токены, личные данные или полный журнал.\n\n'
               'Диагностика и инструкция: https://github.com/stub11/cudy-monitor-pro/issues/71#issuecomment-6795621409')
          params={'chat_id':chat,'message_thread_id':int(topic),'text':msg,'disable_notification':True,'link_preview_options':{'is_disabled':True}}
          url='https://api.telegram.org/bot'+token+'/sendMessage'
          req=urllib.request.Request(url,data=json.dumps(params,ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
              if data.get('ok') and data.get('result',{}).get('message_id'):
                  print('REPLY_SENT: message_id='+str(data['result']['message_id']))
              else:
                  print('REPLY_NOT_SENT: Telegram API did not confirm delivery')
                  sys.exit(1)
          except urllib.error.HTTPError as exc:
              print('REPLY_NOT_SENT: Telegram HTTP '+str(exc.code))
              sys.exit(1)
          except Exception as exc:
              print('REPLY_NOT_SENT: network or delivery error type '+type(exc).__name__)
              sys.exit(1)
          PY
