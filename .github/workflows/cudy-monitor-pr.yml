name: Rust regression checks (pull requests)
on:
  pull_request:
    paths:
      - 'cudy-monitor/**'
      - 'tests/update-manifest-http.sh'
      - '.github/workflows/cudy-monitor-pr.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cudy-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --all-targets
      - name: Sampler state-lock performance regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('src/main.rs').read_text()
          sampler=source.split('fn sample(state:&Arc<Mutex<State>>){',1)[1].split('\nfn history_json(',1)[0]
          acquired=sampler.index('let mut s=state.lock()')
          before, locked=sampler[:acquired],sampler[acquired:]
          for operation in ('mem();','temps().','default_wan();'):
              assert operation in before, f"{operation} missing from pre-lock sample"
              assert operation not in locked, f"{operation} runs while holding state mutex"
          assert before.count('mem();') == 1, 'duplicate memory reads in sampling pass'
          assert 'history_temp' in locked and 'route_wan.as_deref()' in locked
          print('PASS: WAN routes, RAM and temperature sampled without long-held state mutex')
          PY
      - name: Shell syntax checks
        run: |
          sh -n scripts/update.sh
          sh -n scripts/install.sh
          sh -n ../scripts/easy-install.sh
          sh -n scripts/S99cudy-monitor
      - name: Offline release metadata HTTP regression
        run: |
          sh ../tests/update-manifest-http.sh
      - name: Front-end syntax validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('web/index.html').read_text()
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/cudy-monitor-pr-ui.js').write_text(js)
          PY
          node --check /tmp/cudy-monitor-pr-ui.js
      - name: Aurora UI structure and accessibility regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui = Path("web/index.html").read_text()
          assert "AURORA DASHBOARD v2" in ui
          assert "servicebadges" in ui
          assert "replaceChildren(...(d.services||[])" in ui
          assert ui.count('class="nav-symbol" aria-hidden="true"') == 8
          assert "@media(max-width:650px)" in ui
          assert "prefers-reduced-motion:reduce" in ui
          assert "https://fonts." not in ui
          print("Aurora UI checks passed")
          PY

