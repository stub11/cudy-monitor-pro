name: Android Keystore standalone probe
on:
  push:
    branches: [codex/android-keystore-public-ci]
    paths:
      - '.github/workflows/android-keystore-stand.yml'
      - 'tests/android-keystore-stand/**'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build standalone diagnostic APK
        run: |
          sh tests/android-keystore-stand/build-keystore-probe.sh "$RUNNER_TEMP/probe"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/probe/aurora-keystore-probe.apk"
            adb shell am instrument -w -r dev.cm.monitor.cloudstand/.KeystoreProbe > "$RUNNER_TEMP/probe/result.txt"
            cat "$RUNNER_TEMP/probe/result.txt"
            grep -Fq 'PASS: Keystore ECDH and ECDSA round-trips' "$RUNNER_TEMP/probe/result.txt"
            grep -Fq 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/probe/result.txt"
