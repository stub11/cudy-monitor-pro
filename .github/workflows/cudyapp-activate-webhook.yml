name: Activate Cudyapp Telegram webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set Telegram webhook to trusted Vercel handler
        env:
          CUDY_TELEGRAM_BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
          CUDYAPP_WEBHOOK_URL: https://cudyapp-community-bot.vercel.app/api/webhook
        run: python bot/scripts/register_webhook.py
