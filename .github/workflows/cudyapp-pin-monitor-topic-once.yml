name: Pin Cudy Monitor topic welcome guide once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cudyapp-pin-monitor-topic-once.yml'

permissions:
  contents: read

concurrency:
  group: cudyapp-one-time-topic-pin
  cancel-in-progress: false

jobs:
  pin-guide:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(bot): pin monitor topic welcome guide once') && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Pin approved privacy-safe introduction to CM Aurora forum topic
        env:
          CUDY_TELEGRAM_BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
        run: python3 bot/scripts/pin_monitor_topic_guide.py
