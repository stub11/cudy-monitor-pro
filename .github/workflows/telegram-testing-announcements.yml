name: Telegram test APK and Pre-release announcements

on:
  push:
    branches: [main]
    paths:
      - 'scripts/telegram_testing_publisher.py'
      - 'scripts/tests/test_telegram_testing_publisher.py'
      - '.github/workflows/telegram-testing-announcements.yml'
  workflow_run:
    workflows:
      - 'Build isolated OpenWrt candidate APK 1.2.26 (no release)'
    types: [completed]
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cudy-telegram-testing-announcements
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'stub11/cudy-monitor-pro' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bot publisher and topic safety offline
        run: |
          python -m py_compile scripts/telegram_testing_publisher.py
          python -m unittest discover -s scripts/tests -p 'test_telegram_testing_publisher.py' -v
      - name: Announce only verified candidate and test releases to monitor topic
        env:
          GH_TOKEN: ${{ github.token }}
          CUDY_TELEGRAM_BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
          CUDY_TELEGRAM_CHAT_ID: ${{ secrets.CUDY_TELEGRAM_CHAT_ID }}
          CUDY_TELEGRAM_TOPIC_ID: ${{ secrets.CUDY_TELEGRAM_TOPIC_ID }}
        run: python scripts/telegram_testing_publisher.py
