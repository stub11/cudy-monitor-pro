name: CM Android isolated public CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'android-cm/**'
      - '.github/workflows/cm-android-public.yml'
  push:
    branches: [build/cm-android-public-ci]
    paths:
      - 'android-cm/**'
      - '.github/workflows/cm-android-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-cm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare persistent signing for trusted branch pushes only
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/build/cm-android-public-ci' && github.actor == 'stub11'
        env:
          CM_SIGNING_BUNDLE_B64: ${{ secrets.CM_SIGNING_BUNDLE_B64 }}
        shell: bash
        run: |
          if [[ -z "$CM_SIGNING_BUNDLE_B64" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No private signing secret configured. Test APK only."
            exit 0
          fi
          umask 077
          python3 - <<'PY'
          import os, json, base64
          bundle = json.loads(base64.b64decode(os.environ["CM_SIGNING_BUNDLE_B64"], validate=True))
          assert bundle["alias"] == "cm"
          key = base64.b64decode(bundle["keystore_b64"], validate=True)
          password = bundle["password"]
          assert 1000 < len(key) < 50000 and 16 <= len(password) <= 256
          keyfile = os.path.join(os.environ["RUNNER_TEMP"], "cm-stable-signing.p12")
          with open(keyfile, "wb") as out: out.write(key)
          os.chmod(keyfile, 0o600)
          print("::add-mask::" + password)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("CM_SIGNING_STORE_FILE=" + keyfile + "\\n")
              env.write("CM_SIGNING_STORE_PASSWORD=" + password + "\\n")
              env.write("CM_SIGNING_KEY_PASSWORD=" + password + "\\n")
          PY
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build and test CM debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Detect Android app version
        id: version
        run: |
          VERSION=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify persistent APK signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload permanently signed APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CM-android-v${{ steps.version.outputs.value }}
          path: android-cm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned-for-release test APK (not OTA)
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CM-android-test-v${{ steps.version.outputs.value }}
          path: android-cm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Destroy temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/cm-stable-signing.p12"
