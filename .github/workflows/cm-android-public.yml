name: CM Android isolated public CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'android-cm/**'
      - '.github/workflows/cm-android-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-cm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and test CM debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CM-android-debug-apk
          path: android-cm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
