name: ARM64 sensor test build
on:
  push:
    branches: [fix/hwmon-temperature-mt7621]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.head_ref == 'fix/hwmon-temperature-mt7621' || github.ref == 'refs/heads/fix/hwmon-temperature-mt7621'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - name: Build test binary
        working-directory: cudy-monitor
        run: cross build --release --target aarch64-unknown-linux-musl
      - name: Prepare test artifact
        run: |
          mkdir -p sensor-test
          cp cudy-monitor/target/aarch64-unknown-linux-musl/release/cudy-monitor-pro sensor-test/
          cd sensor-test
          file cudy-monitor-pro | grep -E 'ARM aarch64|ARM64|aarch64'
          sha256sum cudy-monitor-pro > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Verify standalone probe under ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          qemu-aarch64 sensor-test/cudy-monitor-pro --sensor-probe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert set(d)=={"cpu","wifi","sensors"}; assert isinstance(d["sensors"],list)'
      - uses: actions/upload-artifact@v4
        with:
          name: cudy-monitor-arm64-sensor-test
          path: sensor-test/
          if-no-files-found: error
