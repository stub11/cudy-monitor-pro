name: One-time verified OpenWrt v1.2.24 test invitation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-openwrt-124-test-20261111.yml'
permissions:
  contents: read
jobs:
  notify:
    if: >-
      github.event.head_commit.message == 'chore: activate verified OpenWrt 1.2.24 invitation'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Send to existing Cudy Monitor topic
        env:
          BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CUDY_TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.CUDY_TELEGRAM_TOPIC_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ.get('BOT_TOKEN','')
          chat=os.environ.get('CHAT_ID','')
          topic=os.environ.get('TOPIC_ID','')
          if not all((token,chat,topic)): raise SystemExit('Telegram destination secrets missing')
          command="curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/cm-migrate.sh https://raw.githubusercontent.com/stub11/cudy-monitor-pro/5468ad266cf88b93e7903b3854681883fde7946d/packaging/openwrt/migrate-legacy.sh && sh -n /tmp/cm-migrate.sh && sh /tmp/cm-migrate.sh"
          text=('Никита, спасибо за помощь с обновлением! 🦊\n\n'
                'Выпустили проверенный сборкой OpenWrt APK 1.2.24. Исправили этап перезапуска службы и сохранили строгие проверки и откат. Но работа на твоём устройстве ещё требует подтверждения.\n\n'
                'Важный нюанс: кнопка в установленной 1.2.21 запускает старый обновлятор, поэтому сейчас НЕ используй её повторно. Если готов на один контролируемый тест по SSH, можно запустить новый проверенный обновлятор из закреплённого коммита:\n\n'
                + command +
                '\n\nОн сначала проверит версию, скачает контрольные суммы и сохранит возможность отката. DNS, PPPoE и прошивку менять не нужно.\n\n'
                'Пришли итог: UPDATED или ROLLBACK, установленную версию и последние строки вывода (без IP и токенов). Если пока не хочешь тестировать — просто оставайся на рабочей 1.2.21.')
          payload=json.dumps({'chat_id':chat,'message_thread_id':int(topic),'text':text}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=payload,headers={'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=15) as response: data=json.load(response)
          except Exception: raise SystemExit('Telegram delivery failed (details redacted)')
          if not data.get('ok'): raise SystemExit('Telegram did not confirm delivery')
          print('Telegram delivery confirmed, message_id='+str(data['result']['message_id']))
          PY
