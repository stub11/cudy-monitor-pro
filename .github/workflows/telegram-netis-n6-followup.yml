name: Ask Netis N6 MIPSEL tester in monitor topic (once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-netis-n6-followup.yml'
      - 'scripts/telegram_netis_n6_followup.py'
      - 'scripts/tests/test_telegram_netis_n6_followup.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cudy-telegram-netis-n6-followup
  cancel-in-progress: false

jobs:
  ask-tester:
    if: github.repository == 'stub11/cudy-monitor-pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests before Telegram
        run: |
          python -m py_compile scripts/telegram_netis_n6_followup.py
          python -m unittest discover -s scripts/tests -p 'test_telegram_netis_n6_followup.py' -v
      - name: Ask tester to verify measurements and provide scrubbed results
        env:
          GH_TOKEN: ${{ github.token }}
          CUDY_TELEGRAM_BOT_TOKEN: ${{ secrets.CUDY_TELEGRAM_BOT_TOKEN }}
          CUDY_TELEGRAM_CHAT_ID: ${{ secrets.CUDY_TELEGRAM_CHAT_ID }}
          CUDY_TELEGRAM_TOPIC_ID: ${{ secrets.CUDY_TELEGRAM_TOPIC_ID }}
        run: python scripts/telegram_netis_n6_followup.py
