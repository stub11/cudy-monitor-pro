name: Telegram testing notices safety (pull requests)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/telegram_testing_publisher.py'
      - 'scripts/tests/test_telegram_testing_publisher.py'
      - '.github/workflows/telegram-testing-announcements.yml'
      - '.github/workflows/telegram-testing-tests.yml'
      - 'scripts/telegram_mipsel_apk_upload.py'
      - 'scripts/tests/test_telegram_mipsel_apk_upload.py'
      - '.github/workflows/telegram-mipsel-apk-file.yml'
      - 'scripts/telegram_netis_n6_followup.py'
      - 'scripts/tests/test_telegram_netis_n6_followup.py'
      - '.github/workflows/telegram-netis-n6-followup.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dedicated test announcements without Telegram or secrets
        run: |
          python -m py_compile scripts/telegram_testing_publisher.py
          python -m unittest discover -s scripts/tests -p 'test_telegram_testing_publisher.py' -v
          python -m unittest discover -s scripts/tests -p 'test_telegram_mipsel_apk_upload.py' -v
          python -m unittest discover -s scripts/tests -p 'test_telegram_netis_n6_followup.py' -v
